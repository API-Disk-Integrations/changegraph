[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "changegraph"
version = "1.0.0"
description = "Monitor companies, products and websites and emit evidence-backed pricing, hiring, product, technology, executive and expansion events."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "API Disk Integrations" }]
keywords = ["api", "sdk", "changegraph"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Libraries",
]
dependencies = []

[tool.hatch.build]
ignore-vcs = true

[project.urls]
Homepage = "https://changegraph-api.com/"
Documentation = "https://changegraph-api.com/#docs"
Pricing = "https://changegraph-api.com/#pricing"
Privacy = "https://changegraph-api.com/privacy"
Terms = "https://changegraph-api.com/terms"
Source = "https://github.com/API-Disk-Integrations/changegraph"
Issues = "https://github.com/API-Disk-Integrations/changegraph/issues"
Changelog = "https://github.com/API-Disk-Integrations/changegraph/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/changegraph"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/changegraph/__init__.py",
]
